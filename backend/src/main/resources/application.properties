spring.application.name=fixgo-backend

# Load backend/.env if present, so `./mvnw spring-boot:run` and the IDE both
# work without exporting anything by hand. `optional:` means startup does not
# fail when the file is absent -- deployed environments supply real environment
# variables instead, which take precedence over anything in the file.
spring.config.import=optional:file:./.env[.properties]

# Credentials come from the environment, never from this file (NFR-01).
# See backend/README.md for the variables and how to obtain them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only checks that the @Entity classes match
# what the migrations produced, and fails startup if they have drifted -- which
# is how you find a missing migration in two seconds instead of at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Print generated SQL while the team is still learning the mapping. Turn off
# before the pilot: it is noisy and can echo data into logs.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Neon closes idle connections; keep the pool small and recycle it well inside
# that window. The free tier also has a low connection ceiling, and every
# developer's laptop shares it.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=280000

# Return proper JSON for unmapped routes rather than an empty 500.
spring.web.resources.add-mappings=false

# Close the persistence context when the service method returns, instead of
# holding it open through response serialisation. Left on (the default), a lazy
# association touched during JSON serialisation silently fires an extra query
# per row, and the connection is held for the whole request. Off, that mistake
# throws LazyInitializationException in development instead of quietly becoming
# an N+1 in production -- which matters most on the FR-05 open-jobs feed.
spring.jpa.open-in-view=false
